plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.kapt'
}

def localProps = new Properties()
def localFile = rootProject.file('local.properties')
if (localFile.exists()) {
    localFile.withInputStream { localProps.load(it) }
}

android {
    namespace 'com.custom.vox.homemonitor'
    compileSdk 34

    defaultConfig {
        applicationId "com.custom.vox.homemonitor"
        minSdk 21
        targetSdk 30
        // Continue BF3 lineage (do not regress to 0.1.0 — would confuse upgrades).
        versionCode 47
        versionName "1.8.0-beta.3"

        // Pure-Kotlin APK (no .so). Keep armeabi-v7a for VOX; arm64-v8a for modern Google TV.
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }

        // Empty defaults for beta APKs. -Pwf1.proxy.baseUrl= / -Pwf1.proxy.token= win even when empty.
        // Without -P, local.properties seeds owner *debug* upgrades only (release forces empty).
        def wf1Url = project.hasProperty('wf1.proxy.baseUrl')
                ? project.property('wf1.proxy.baseUrl').toString()
                : localProps.getProperty('wf1.proxy.baseUrl', '')
        def wf1Token = project.hasProperty('wf1.proxy.token')
                ? project.property('wf1.proxy.token').toString()
                : localProps.getProperty('wf1.proxy.token', '')
        buildConfigField "String", "WF1_PROXY_BASE_URL", "\"${wf1Url}\""
        buildConfigField "String", "WF1_PROXY_TOKEN", "\"${wf1Token}\""
        buildConfigField "int", "ADMIN_PORT",
                "${localProps.getProperty('admin.port', '8765')}"
        // Diagnostic overlay off in production Now Playing builds.
        buildConfigField "boolean", "MEDIA_SESSION_DIAG", "false"
        // Public client DSN only (never an auth token). Overridable via local.properties / -Psentry.dsn=
        def sentryDsn = project.hasProperty('sentry.dsn')
                ? project.property('sentry.dsn').toString()
                : localProps.getProperty('sentry.dsn', 'https://4accb33c7662d01d17fbef105b643349@o4510668137562112.ingest.de.sentry.io/4512397006995536')
        buildConfigField "String", "SENTRY_DSN", "\"${sentryDsn}\""

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    def releaseStoreFile = System.getenv("HM_STORE_FILE") ?: localProps.getProperty("hm.storeFile", "")
    def releaseStorePassword = System.getenv("HM_STORE_PASSWORD") ?: localProps.getProperty("hm.storePassword", "")
    def releaseKeyAlias = System.getenv("HM_KEY_ALIAS") ?: localProps.getProperty("hm.keyAlias", "")
    def releaseKeyPassword = System.getenv("HM_KEY_PASSWORD") ?: localProps.getProperty("hm.keyPassword", "")
    def hasReleaseSigning = releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile rootProject.file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            debuggable false
            // Never ship owner LAN WF1 seeds in release/beta artifacts.
            buildConfigField "String", "WF1_PROXY_BASE_URL", "\"\""
            buildConfigField "String", "WF1_PROXY_TOKEN", "\"\""
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        buildConfig true
        viewBinding true
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }

    testOptions {
        unitTests.includeAndroidResources = false
    }

    lint {
        // Sideload beta is not Play Store; targetSdk 30 is intentional for VOX TitanOS.
        disable 'ExpiredTargetSdkVersion'
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.leanback:leanback:1.0.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    def room_version = '2.6.1'
    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    kapt "androidx.room:room-compiler:$room_version"

    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    // Manual SDK only (no Gradle plugin / no auto-init) — opt-in at runtime.
    implementation 'io.sentry:sentry-android:8.63.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.11.1'
    testImplementation 'androidx.test:core:1.5.0'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.3'
    testImplementation 'org.json:json:20231013'
}
